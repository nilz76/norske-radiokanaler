name: Sjekk strømmer

on:
  schedule:
    # Hver mandag 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "stations.json"
      - "scripts/**"
      - ".github/workflows/check-streams.yml"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sjekk at spillelistene er i takt med stations.json
        run: |
          python3 scripts/build_playlists.py
          git diff --exit-code -- playlists/ || {
            echo "::error::playlists/ er ikke oppdatert. Kjør: python3 scripts/build_playlists.py"
            exit 1
          }

      - name: Sjekk alle strøm-URL-er
        id: check
        run: |
          python3 scripts/check_streams.py --report | tee check.log
        continue-on-error: true

      - name: Se om NRK har endret URL-ene sine
        if: steps.check.outcome == 'failure'
        run: python3 scripts/refresh_nrk.py | tee -a check.log
        continue-on-error: true

      - name: Opprett issue hvis noe er dødt
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('check.log', 'utf8').split('\n')
              .filter(line => !line.startsWith('OK '))
              .join('\n')
              .slice(0, 60000);
            const title = 'Døde strømmer oppdaget';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dead-stream',
            });
            const body = [
              `Den ukentlige sjekken fant strømmer som ikke svarer.`,
              ``,
              '```',
              log,
              '```',
              ``,
              `Se README.md → «Når en strøm slutter å virke».`,
              ``,
              `[Kjøringen](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dead-stream'],
              });
            }

      - name: Marker jobben som feilet
        if: steps.check.outcome == 'failure'
        run: exit 1
